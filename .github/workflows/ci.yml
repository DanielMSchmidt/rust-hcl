name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt / clippy / build / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Toolchain comes from rust-toolchain.toml, so no version is duplicated here.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo build --all-targets
      # Conformance tests fail until the corresponding behavior is implemented, which is
      # the point. Tests needing the pinned Go upstreams skip when REFERENCE_DIR is unset.
      - run: cargo test
